[workspace]
resolver = "2"
members = [
    "crates/volumen-core",
    "crates/volumen-zarr",
    "crates/volumen-geom",
    "crates/volumen-sampler",
    "crates/volumen-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Silvere Martin-Michiellot", "Volumen Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/silveremartin-dev/Volumen"
homepage = "https://github.com/silveremartin-dev/Volumen"
keywords = ["vesuvius-challenge", "volumetric-rendering", "zarr", "hpc", "herculaneum"]
categories = ["science", "graphics", "command-line-utilities"]

[workspace.dependencies]
# Internal workspace crates
volumen-core = { path = "crates/volumen-core" }
volumen-zarr = { path = "crates/volumen-zarr" }
volumen-geom = { path = "crates/volumen-geom" }
volumen-sampler = { path = "crates/volumen-sampler" }

# Numerical & Linear Algebra
nalgebra = { version = "0.33", features = ["serde-serialize"] }
glam = { version = "0.29", features = ["serde"] }
rayon = "1.10"
crossbeam = "0.8"

# I/O, Serialization, Compression
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
tiff = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }

# CLI & Utilities
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
indicatif = { version = "0.17", features = ["rayon"] }

# Testing & Benchmarking
criterion = "0.5"
tempfile = "3.14"
proptest = "1.6"
